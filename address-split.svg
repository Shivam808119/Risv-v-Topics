<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" font-family="Arial, Helvetica, sans-serif">
<rect width="800" height="260" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">How a cache cuts a memory address into 3 pieces</text>
<rect x="40" y="55" width="400" height="60" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
<text x="240" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#3730a3">TAG</text>
<rect x="440" y="55" width="200" height="60" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
<text x="540" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#115e59">INDEX</text>
<rect x="640" y="55" width="120" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="700" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400e">OFFSET</text>
<g font-size="14" fill="#222" text-anchor="middle">
<text x="240" y="145">"Which of the many possible</text><text x="240" y="165">blocks is this one?"</text><text x="240" y="195" fill="#3730a3">stored with the block, compared on lookup</text>
<text x="540" y="145">"Which set (row)</text><text x="540" y="165">do I look in?"</text><text x="540" y="195" fill="#115e59">picks the row</text>
<text x="700" y="145">"Which byte</text><text x="700" y="165">inside the block?"</text><text x="700" y="195" fill="#92400e">64-byte block = 6 bits</text>
</g>
<text x="400" y="240" text-anchor="middle" font-size="13" fill="#555">Address bits, high (left) to low (right)</text>
</svg>
