<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" font-family="Arial, Helvetica, sans-serif">
<rect width="720" height="320" fill="#ffffff"/>
<text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">The time gap between a cache hit and miss is the signal</text>
<rect x="60" y="170" width="150" height="70" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<text x="135" y="203" text-anchor="middle" font-weight="bold">HIT</text><text x="135" y="225" text-anchor="middle" font-size="13">~40 cycles</text>
<rect x="300" y="60" width="150" height="180" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<text x="375" y="140" text-anchor="middle" font-weight="bold">MISS</text><text x="375" y="162" text-anchor="middle" font-size="13">~300 cycles</text>
<line x1="40" y1="240" x2="480" y2="240" stroke="#333" stroke-width="2"/>
<text x="500" y="105" font-size="14" fill="#222">Attacker times its own access:</text>
<text x="500" y="130" font-size="14" fill="#16a34a">fast = someone touched this block</text>
<text x="500" y="155" font-size="14" fill="#dc2626">slow = nobody did (or it was evicted)</text>
<text x="500" y="195" font-size="14" fill="#222">Pattern of touched blocks</text>
<text x="500" y="215" font-size="14" fill="#222">= pattern of the victim's secret.</text>
<text x="360" y="290" text-anchor="middle" font-size="13" fill="#555">Height of the bar = time taken</text>
</svg>
