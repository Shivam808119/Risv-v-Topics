<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Arial, Helvetica, sans-serif">
<rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker></defs>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">False sharing: two cores fight over one 64-byte block</text>
<rect x="200" y="120" width="360" height="70" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="380" y="112" text-anchor="middle" font-size="13" fill="#555">ONE cache block (64 bytes)</text>
<rect x="215" y="135" width="90" height="40" fill="#fda4af" stroke="#be123c" stroke-width="2"/><text x="260" y="162" text-anchor="middle" font-weight="bold">var A</text>
<rect x="320" y="135" width="90" height="40" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/><text x="365" y="162" text-anchor="middle" font-weight="bold">var B</text>
<rect x="20" y="230" width="190" height="60" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/><text x="115" y="266" text-anchor="middle" font-weight="bold">Core 0 writes A</text>
<rect x="550" y="230" width="190" height="60" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="645" y="266" text-anchor="middle" font-weight="bold">Core 1 writes B</text>
<path d="M115 230 L250 192" stroke="#444" stroke-width="2" marker-end="url(#f)"/>
<path d="M645 230 L510 192" stroke="#444" stroke-width="2" marker-end="url(#f)"/>
<text x="380" y="250" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="bold">Each write invalidates the other core's copy.</text>
<text x="380" y="272" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="bold">The block ping-pongs. Up to 10x slower!</text>
<text x="380" y="315" text-anchor="middle" font-size="13" fill="#166534">Fix: put A and B in separate blocks (padding).</text>
</svg>
