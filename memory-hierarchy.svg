<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="Arial, Helvetica, sans-serif">
<rect width="760" height="470" fill="#ffffff"/>
<text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">The Memory Hierarchy: small and fast on top, big and slow at the bottom</text>
<polygon points="380,50 430,105 330,105" fill="#fecdd3" stroke="#be123c" stroke-width="2"/>
<text x="380" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#111">Registers</text>
<polygon points="330,110 430,110 480,165 280,165" fill="#fda4af" stroke="#be123c" stroke-width="2"/>
<text x="380" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">L1 cache</text>
<polygon points="280,170 480,170 530,225 230,225" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/>
<text x="380" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">L2 cache</text>
<polygon points="230,230 530,230 580,285 180,285" fill="#67e8f9" stroke="#0891b2" stroke-width="2"/>
<text x="380" y="263" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">L3 cache (shared)</text>
<polygon points="180,290 580,290 630,345 130,345" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
<text x="380" y="323" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Main memory (DRAM)</text>
<polygon points="130,350 630,350 680,405 80,405" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
<text x="380" y="383" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">SSD / Disk</text>
<g font-size="13" fill="#333">
<text x="500" y="90">~100 B  | under 1 cycle</text>
<text x="500" y="145">32-64 KB | ~4 cycles</text>
<text x="545" y="205">~1 MB | ~12 cycles</text>
<text x="595" y="263">8-64 MB | ~40 cycles</text>
<text x="645" y="323">GBs | ~200+ cycles</text>
<text x="600" y="440">TBs | ~100,000 cycles</text>
</g>
<text x="40" y="150" font-size="13" fill="#be123c" font-weight="bold">FAST + SMALL + COSTLY</text>
<text x="40" y="380" font-size="13" fill="#555" font-weight="bold">SLOW + BIG + CHEAP</text>
<path d="M30 160 L30 365" stroke="#999" stroke-width="2" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#999"/></marker></defs>
</svg>
